<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição XII CONFADER - PVH</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header centralizer-containers default-colors ">
        <h1 class="page-heading">CABEÇALHO EXEMPLO</h1>
    </header>

    <!--Main content-->
    <main class="main-content centralizer-containers">
        <article class="registration-form">
            <!--Formulary-->
            <form class="formulary centralizer-containers default-colors" aria-label="registration-form" action="#" method="#" target="_blank"
                autocomplete="off">

                <!--Personal data-->
                <fieldset class="personal-data centralizer-containers">
                    <!--Field's title-->
                    <legend class="legend-1">Dados pessoais</legend>

                    <!--Full name input-->
                    <div class="full-name input-container">
                        <label for="full-name">Nome completo</label>
                        <input type="text" id="full-name" name="full-name" placeholder="Digite seu nome">
                    </div>

                    <!--CPF input-->
                    <div class="cpf input-container">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                    </div>

                    <!--Entrada da Data de Nascimento-->
                    <div class="birth-data input-container">
                        <label for="birth-data">Data de nascimento</label>
                        <input type="date" id="birth-data" name="birth-data">
                    </div>
                </fieldset>

                <!--Contact-->
                <fieldset class="contact centralizer-containers">
                    <!--Field's title-->
                    <legend class="legend-2">Contato</legend>

                    <!--Phone input-->
                    <div class="phone input-container">
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
                    </div>

                    <!--Entrada do telefone 2-->
                    <div class="phone-2 input-container">
                        <label for="phone-2">Telefone 2</label>
                        <input type="tel" id="phone-2" name="phone-2" placeholder="(00) 00000-0000">
                    </div>

                    <!--Entrada do E-mail-->
                    <div class="email input-container">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                    </div>
                </fieldset>

                <!--Adress-->
                <fieldset class="adress centralizer-containers">
                    <!--Field's title-->
                    <legend class="legend-3">Endereço</legend>

                    <div class="duo-a duos">
                        <!--CEP-->
                        <div class="cep">
                            <label for="cep">CEP</label>
                            <input type="" id="cep" name="cep" placeholder="00000-000">
                        </div>

                        <!--House number-->
                        <div class="house-number">
                            <label for="house-number">Número</label>
                            <input type="text" id="house-number" name="house-number" placeholder="0000">
                        </div>
                    </div>

                    <div class="duo-b duos">
                        <!--Street-->
                        <div class="street">
                            <label for="street">Rua</label>
                            <input type="text" id="street" name="street" placeholder="Rua exemplo">
                        </div>

                        <!--Neighborhood-->
                        <div class="ngbhd">
                            <label for="ngbhd">Bairro</label>
                            <input type="text" id="ngbhd" name="ngbhd" placeholder="Bairro exemplo">
                        </div>
                    </div>

                    <div class="duo-c duos">
                        <!--City-->
                        <div class="city">
                            <label for="city">Cidade</label>
                            <input type="text" id="city" name="city" placeholder="Cidade exemplo">
                        </div>

                        <!--State-->
                        <div class="state">
                            <label for="state">Estado</label>
                            <input type="text" id="state" name="state" placeholder="EE">
                        </div>
                    </div>

                    <!--Complement-->
                    <div class="complement input-container">
                        <label for="complement">Complemento</label>
                        <input type="text" id="complement" name="complement" placeholder="Complemento exemplo">
                    </div>
                </fieldset>

                <!--Church's data-->
                <fieldset class="churchs-data centralizer-containers">
                    <!-- Field's title -->
                    <legend class="legend-4">Dados Institucionais</legend>

                    <!--Church's Name-->
                    <div class="churchs-name input-container">
                        <label for="churchs-name">Nome da instituição</label>
                        <input type="text" id="churchs-name" name="churchs-name" placeholder="Nome exemplo">
                    </div>

                    <!--Church's city-->
                    <div class="churchs-city input-container">
                        <label for="churchs-city">Cidade</label>
                        <input for="churchs-city" id="churchs-city" name="churchs-city" placeholder="Cidade exemplo">
                    </div>

                    <!--Local leader-->
                    <div class="local-leader input-container">
                        <label for="local-leader">Lídel da unidade local</label>
                        <input type="text" id="local-leader" name="local-leader" placeholder="Nome exemplo">
                    </div>
                </fieldset>

                <!--Button "CONTINUE" -> takes to the payment page-->
                <div class="submit-button">
                    <button type="submit">CONTINUAR</button>
                </div>
            </form>
        </article>
    </main>

    <!--Rodapé-->
    <footer class="footer">
        <!--Texto informativo do rodapé-->
        <p clss="xxi-confader">XII CONMERON</p>
        <p class="iead">Instituição Exemplo</p>
        <p class="pvh">Cidade exemplo/EE</p>
    </footer>
</body>

</html>
